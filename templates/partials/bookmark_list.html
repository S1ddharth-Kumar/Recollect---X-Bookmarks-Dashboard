<div class="grid gap-4">
  {% for item in results %}
    <article class="bookmark-card">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-sm text-stone-400">
            {{ item.tweet.author }} <span class="text-stone-500">{{ item.tweet.handle }}</span>
          </p>
          <a class="mt-3 block text-lg text-stone-100" href="/bookmarks/{{ item.tweet.tweet_id }}">
            {{ item.tweet.text }}
          </a>
        </div>
        <div class="text-right">
          <span class="tag">{{ item.tweet.category }}</span>
          <p class="mt-3 text-xs uppercase tracking-[0.2em] text-stone-500">{{ item.source }}</p>
          <p class="mt-1 text-sm text-amber-200">{{ "%.3f"|format(item.score) }}</p>
        </div>
      </div>
      <div class="mt-4 flex flex-wrap gap-2">
        {% for tag in item.tweet.tags %}
          <span class="tag tag-subtle">#{{ tag }}</span>
        {% endfor %}
      </div>
    </article>
  {% else %}
    <article class="bookmark-card">
      <p class="text-stone-300">No bookmarks matched this search yet.</p>
    </article>
  {% endfor %}
</div>
