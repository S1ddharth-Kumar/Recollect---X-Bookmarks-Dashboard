{% extends "base.html" %}

{% block content %}
  <section class="section-panel">
    <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="eyebrow">The General Catalog</p>
        <h2 class="mt-2 text-3xl uppercase tracking-wider text-slate-900">Peruse the Complete Collection</h2>
      </div>
      <p class="max-w-xl text-sm italic text-slate-600 font-serif">
        Narrow your exploration by entering a specific query, or sort through the archive using the filter drawer below.
      </p>
    </div>

    <form class="mt-8 space-y-4" action="/search" method="get">
      <input type="hidden" name="mode" value="{{ mode }}" />
      <div class="search-row">
        <input class="field field-search" type="search" name="q" value="{{ query }}" placeholder="Search bookmarks, authors, topics, links..." />
        <button class="button-primary uppercase tracking-wider" type="submit">Search</button>
      </div>
      <div class="filter-ribbon">
        <div class="ribbon-group">
          <label class="ribbon-label" for="library-category">Category</label>
          <select class="field field-compact" id="library-category" name="category">
            <option value="">All categories</option>
            {% for category, _ in category_counts %}
              <option value="{{ category }}" {% if selected_category == category %}selected{% endif %}>{{ category }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="ribbon-group">
          <label class="ribbon-label" for="library-media">Filter</label>
          <select class="field field-compact" id="library-media" name="media">
            <option value="all" {% if selected_media == "all" %}selected{% endif %}>All media</option>
            <option value="images" {% if selected_media == "images" %}selected{% endif %}>Images</option>
            <option value="video" {% if selected_media == "video" %}selected{% endif %}>Video</option>
            <option value="text" {% if selected_media == "text" %}selected{% endif %}>Text only</option>
          </select>
        </div>
        <div class="ribbon-group">
          <label class="ribbon-label" for="library-sort">Sort</label>
          <select class="field field-compact" id="library-sort" name="sort">
            <option value="relevance" {% if selected_sort == "relevance" %}selected{% endif %}>Best match</option>
            <option value="newest" {% if selected_sort == "newest" %}selected{% endif %}>Newest first</option>
            <option value="oldest" {% if selected_sort == "oldest" %}selected{% endif %}>Oldest first</option>
            <option value="author" {% if selected_sort == "author" %}selected{% endif %}>Author A-Z</option>
          </select>
        </div>
        <button class="button-secondary button-small uppercase tracking-wider" type="submit">Apply</button>
      </div>
    </form>
  </section>

  <section id="results" class="mt-8">
    {% include "partials/bookmark_list.html" %}
  </section>
{% endblock %}
