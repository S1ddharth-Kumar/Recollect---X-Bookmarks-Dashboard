<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recollect — Your X bookmarks, organised</title>
    <meta name="description" content="Recollect is a local-first dashboard for exploring, searching and organising your X / Twitter bookmarks." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}" />
  </head>
  <body class="app-body">

    <!-- Scrolling code-rain background -->
    <div class="code-rain-layer" id="codeRain" aria-hidden="true"></div>

    <!-- Floating pill nav -->
    <nav class="pill-nav" role="navigation" aria-label="Main navigation">
      <a href="/" class="pill-brand">Recollect</a>
      <div class="pill-links">
        <a class="pill-link {% if request.url.path == '/' %}pill-link-active{% endif %}" href="/">Home</a>
        <a class="pill-link {% if request.url.path == '/search' %}pill-link-active{% endif %}" href="/search">Bookmarks</a>
        <form action="/sync" method="post" class="inline m-0">
          <button class="pill-action" type="submit">Sync</button>
        </form>
      </div>
    </nav>

    <div class="page-shell">
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>

    <script>
      // Generate a simple scrolling random-character rain effect
      (function () {
        const el = document.getElementById('codeRain');
        if (!el) return;
        const chars = '0123456789abcdefABCDEF#@$%&x0';
        const cols = Math.floor(window.innerWidth / 9);
        const rows = 28;
        let lines = Array.from({ length: rows }, () =>
          Array.from({ length: cols }, () => chars[Math.floor(Math.random() * chars.length)]).join(' ')
        );
        function render() {
          el.textContent = lines.join('\n');
        }
        function tick() {
          // shift lines up and add a new random line at bottom
          lines.shift();
          lines.push(
            Array.from({ length: cols }, () => chars[Math.floor(Math.random() * chars.length)]).join(' ')
          );
          render();
        }
        render();
        setInterval(tick, 120);
      })();
    </script>
  </body>
</html>
