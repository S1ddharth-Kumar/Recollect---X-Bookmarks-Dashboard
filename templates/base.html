<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}" />
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-100">
    <div class="page-shell">
      <header class="mx-auto flex w-full max-w-7xl items-center justify-between px-6 py-8">
        <div>
          <a href="/" class="text-sm uppercase tracking-[0.3em] text-amber-300/80">Local knowledge base</a>
          <h1 class="mt-2 text-3xl font-semibold text-stone-50">{{ app_name }}</h1>
        </div>
        <nav class="flex items-center gap-3 text-sm">
          <a class="nav-pill" href="/">Dashboard</a>
          <a class="nav-pill" href="/search">Search</a>
          <form action="/sync" method="post">
            <button class="nav-pill nav-pill-primary" type="submit">Run sync</button>
          </form>
        </nav>
      </header>

      <main class="mx-auto w-full max-w-7xl px-6 pb-16">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
